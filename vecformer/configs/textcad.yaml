# Phase 3: TextCAD reproduction on FloorPlanCAD-V2 (TextCAD split, 9533 train).
# TextCAD: 700 epochs, lr 1e-4, warmup 5%. Batch 2 x 8 GPUs = 16 -> 595 steps/epoch (drop_last),
# 416,500 steps; decay over the last 20% (83,300); evaluate every 5 epochs.
# -------------------------- log ------------------------- #
log_level: info
log_on_each_node: false
logging_steps: 200
logging_first_step: true
report_to:
    - tensorboard

# ------------------------- train ------------------------ #
num_train_epochs: 700
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
optim: adamw_torch_fused
learning_rate: 0.0001
lr_scheduler_type: warmup_stable_decay
warmup_ratio: 0.05
lr_scheduler_kwargs:
    num_decay_steps: 83300
    min_lr_ratio: 0.1
weight_decay: 0.05

# ------------------------- eval ------------------------- #
batch_eval_metrics: true
eval_strategy: steps
eval_steps: 2975
eval_on_start: true

# ------------------------- save ------------------------- #
metric_for_best_model: PQ
save_strategy: best

# ------------------------- data ------------------------- #
dataloader_num_workers: 64
dataloader_drop_last: true # TODO!: if false, the eval step will have some strange bugs, wait to fix