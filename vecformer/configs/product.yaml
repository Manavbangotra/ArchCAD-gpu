# Phase 4: product model, joint FloorPlanCAD-V2 + US plan windows + CubiCasa5K in
# Arch-43, warm-started from the Phase 3 checkpoint (model init_checkpoint).
# An epoch is the summed training size: 9,533 FloorPlanCAD + 26,274 US windows (3
# projects held out for validation) + 4,197 CubiCasa = 40,004 -> 2,500 steps at batch
# 16; samples are drawn by source weight. 150 epochs = 375,000 steps, ~100 passes
# over the US windows (45% of samples) on top of the warm start; decay over the last
# 20% (75,000); evaluation every 5 epochs (12,500 steps).
# Evaluation is per source (eval_fpcad_*, eval_us_*, eval_cubicasa_*); the best
# checkpoint is chosen on US PQ, with the FloorPlanCAD regression checked by hand
# against the Phase 3 gate (<= 2 PQ).
# -------------------------- log ------------------------- #
log_level: info
log_on_each_node: false
logging_steps: 200
logging_first_step: true
report_to:
    - tensorboard

# ------------------------- train ------------------------ #
num_train_epochs: 150
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
optim: adamw_torch_fused
learning_rate: 0.0001
lr_scheduler_type: warmup_stable_decay
warmup_ratio: 0.05
lr_scheduler_kwargs:
    num_decay_steps: 75000
    min_lr_ratio: 0.1
weight_decay: 0.05

# ------------------------- eval ------------------------- #
batch_eval_metrics: true
eval_strategy: steps
eval_steps: 12500
eval_on_start: true

# ------------------------- save ------------------------- #
metric_for_best_model: us_PQ
save_strategy: best

# ------------------------- data ------------------------- #
dataloader_num_workers: 64
dataloader_drop_last: true # TODO!: if false, the eval step will have some strange bugs, wait to fix