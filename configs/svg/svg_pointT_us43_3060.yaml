# The 43-class Arch taxonomy on US construction documents, one RTX 3060 (12GB).
#
# Supersedes svg_pointT_us_3060.yaml, which is the same recipe over 3 classes.
# The geometry, the schedule and the memory budget are unchanged; only the label
# space is wider.
#
# Why 43 and not 3: under the old taxonomy every toilet, sink, cabinet, sofa,
# stair and railing on a sheet was labelled background, so the model was being
# taught that fixtures and furniture are empty space. Measured over the 2,323
# distinct CAD layer names in this corpus, the 4-class rules gave a real label
# to 16.2% of the layer vocabulary; Arch-43 gives one to 50.1%.
#
# Ids 1-35 are FloorPlanCAD's, unchanged and in their original order, so a
# FpCAD-pretrained checkpoint transfers its classifier head row for row instead
# of having it dropped as a size mismatch -- which is what happened under the
# 3-class config (svgnet/util/utils.py skips size-mismatched tensors silently).
# Ids 36-43 are the US families FloorPlanCAD has no class for: column, framing,
# roof, electrical, mechanical, pipe, site, equipment.
#
# Labels still come free from the AIA CAD layer names in the PDF's optional
# content groups (dataset/parse_pdf_plans.py --taxonomy arch). Three consequences:
#   * The labels are a heuristic, so the metrics measure agreement with that
#     heuristic and not with ground truth. The split is by *project*, so no
#     building appears in both train and test, but a systematic layer-naming
#     mistake would not show up in any number here.
#   * A layer name is coarser than the taxonomy. A-DOOR does not say which of
#     the six door subtypes; I-FURN does not say sofa vs bed. Those primitives
#     carry a coarse band-C id (51-55), which sits above background. With
#     coarse_policy: bg they read as background, which is the safe default and
#     what this config does. Switching to `keep` requires the marginal loss in
#     svgnet/model/criterion.py -- do not set it before that lands.
#   * model.use_layer_fusion stays False, and the reason is now stronger, not
#     weaker: with labels derived from layers, predicting each layer group's
#     majority class already scores 100%, and a coarse id like door-any is
#     literally "the identity of this layer group".
#
# Background is ~86% of primitives and rises under this taxonomy, because the
# tier-3 rules deliberately refuse to guess. svg_pointT_us_3060.yaml records
# that dropping class weighting is how an earlier run collapsed to
# all-background, so measure the weights before the first full run:
#     python tools/corpus_weights.py --root dataset/us_plans/json5 --split train
#
# LICENCE: if a CubiCasa-pretrained checkpoint is used as `pretrain`, this model
# inherits CC BY-NC 4.0 and is research-only. A FloorPlanCAD or from-scratch
# start does not carry that.

model:
  in_channels: 10
  semantic_classes: 43
  use_layer_fusion: False
  num_decoders: 3
  dropout: 0.1
  pre_norm: False
  num_heads: 8
  shared_decoder: True
  dim_feedforward: 512
  hidden_dim: 256
  num_queries: 800
  gauss_scale: 1.0
  normalize_pos_enc: False
  scalar: 1
  dn_mask_noise_scale: 0.0
  dn_label_noise_ratio: 0.2
  vision:
    dim: 64
    backbone: "hrnet48"
    yaml: "configs/svg/hrnet48.yaml"
    pretrained: "svgnet/pretrained/hrnet_ocr_cocostuff_3965_torch04.pth"

matcher:
  cost_class: 2.
  cost_mask: 7.
  cost_dice: 5.
  num_points: -1

criterion:
  num_classes: 43
  eos_coef: 0.05
  losses:
    - "labels"
    - "masks"
  ignore_label: -1
  # 43 sqrt-inverse-frequency weights, normalised to mean 1 and clipped.
  # -1 means unweighted, which is correct only for a smoke test: background
  # is ~86% of primitives and rises under this taxonomy, and calling
  # everything background is the cheapest move available to the model. That
  # is how the earlier CubiCasa run collapsed. criterion.py asserts the list
  # is exactly num_classes long, so a stale 3-entry list fails loudly.
  class_weights: [0.475, 0.475, 0.475, 0.475, 0.475, 0.475, 0.314, 1.0, 1.0, 1.0, 0.845, 0.845, 0.845, 0.845, 0.845, 0.845, 0.3, 3.301, 0.3, 3.301, 3.301, 0.3, 0.3, 3.301, 0.3, 0.3, 0.3, 0.391, 2.172, 1.0, 1.0, 5.0, 0.3, 1.0, 0.662, 0.498, 1.384, 0.685, 0.3, 0.941, 0.881, 0.452, 0.3]
  # Measured: tools/corpus_weights.py --root dataset/us_plans/json5 --split train
  # 900 tiles, 6.1M primitives, sqrt-inverse frequency, mean 1, clipped 0.3-5.0.
  # Classes with no support here get 1.0, which provably does not matter:
  # F.cross_entropy weights by the target class, and a class that is never a
  # target never contributes.
  num_points: -1
  contrast:
    num_classes: 44
    stage: "Ua"
    num_layers: 5
    ftype: "f_out"
    dist: "l2"
    pos: "cnt"
    contrast_func: "softnn"
    sample: "label"
    temperature: 2.0
    weight: 8.0

data:
  train:
    img_size: 700
    type: 'svg'
    num_classes: 43
    data_root: 'dataset/us_plans/json5'
    repeat: 1
    split: "train"
    # canonical, not bg.
    #
    # A CAD layer says "door" but not which of the six subtypes, so those
    # primitives carry the coarse door-any id. Under coarse_policy: bg they read
    # as background -- which would make this 43-class run WORSE at doors than the
    # 3-class one it replaces, since the old taxonomy at least had a single
    # "door" class. Same for A-FLOR-PFIX (fixture-any) and I-FURN
    # (furniture-any); between them that is 5.7% of primitives.
    #
    # canonical assigns the group's modal member, so a US door trains as "single
    # door". That is a real bias -- every double and sliding door in this corpus
    # is labelled single -- and it is still better than teaching the model that
    # doors are empty space. The honest fix is the marginal loss
    # (-log sum of the group's probabilities), after which this becomes "keep".
    coarse_policy: "canonical"
    data_norm: "mean"
    aug:
      aug_prob: 0.3
      hflip: True
      vflip: True
      color: True
      rotate:
        enable: False
        angle: [-180,180]
      rotate2: False
      scale:
        enable: False
        ratio: [0.5,1.5]
      shift:
        enable: False
        scale: [-0.5,0.5]
      cutmix:
        enable: False
        queueK: 4
        relative_shift: [-0.5,0.5]

  test:
    img_size: 700
    type: 'svg'
    num_classes: 43
    data_root: 'dataset/us_plans/json5'
    repeat: 1
    split: "test"
    # canonical, not bg.
    #
    # A CAD layer says "door" but not which of the six subtypes, so those
    # primitives carry the coarse door-any id. Under coarse_policy: bg they read
    # as background -- which would make this 43-class run WORSE at doors than the
    # 3-class one it replaces, since the old taxonomy at least had a single
    # "door" class. Same for A-FLOR-PFIX (fixture-any) and I-FURN
    # (furniture-any); between them that is 5.7% of primitives.
    #
    # canonical assigns the group's modal member, so a US door trains as "single
    # door". That is a real bias -- every double and sliding door in this corpus
    # is labelled single -- and it is still better than teaching the model that
    # doors are empty space. The honest fix is the marginal loss
    # (-log sum of the group's probabilities), after which this becomes "keep".
    coarse_policy: "canonical"
    data_norm: "mean"
    aug: False

dataloader:
  train:
    batch_size: 2
    num_workers: 6
  test:
    batch_size: 2
    num_workers: 6

optimizer:
  type: 'AdamW'
  lr: 0.0002
  weight_decay: 0.1
  weight_decay_embed: 0.1
  decoder_multiplier: 1.0
  clip_gradients_enabled: True
  clip_gradients_type: "full_model"
  clip_gradients_norm_type: 2.0
  clip_gradients_value: 2.0

scheduler:
  type: 'cosine'
  warmup_epochs: 3
  min_lr: 1e-7

fp16: True
epochs: 60
step_epoch: 2
save_freq: 10
save_interval_iters: 500
# Stage-1 CubiCasa checkpoint. tools/train.py loads it non-strict and skips
# size-mismatched tensors, so the backbone transfers even if the head differs.
# No pretrain by default. The CubiCasa and US checkpoints on disk are 3-class:
# their class_embed_head and label_enc are the wrong shape, and
# svgnet/util/utils.py drops size-mismatched tensors *silently*, so pointing
# at one here would look like it worked while throwing the classifier away.
# A FloorPlanCAD 35-class checkpoint is the one worth warm-starting from --
# ids 1-35 mean the same thing in both taxonomies.
pretrain: ''
work_dir: './work_dirs/us43_3060'

# batch 2 x 8 = effective 16, matching the learning rate above.
accumulate_steps: 8

# Stop when mIoU stops improving rather than always running 60 epochs.
early_stop:
  metric: miou
  patience: 8
  min_delta: 0.1
