# Door / window / wall on US construction documents, one RTX 3060 (12GB).
#
# Stage 2 of two. Stage 1 (svg_pointT_cc_3060.yaml) pretrains on CubiCasa5K;
# this adapts that model to real construction sheets, which carry the dimension
# lines, hatching, schedules and title blocks CubiCasa has none of.
#
# Labels come free from the AIA CAD layer names preserved in the PDF's optional
# content groups (dataset/parse_pdf_plans.py -> dataset/taxonomy.py). No manual
# annotation. Two consequences to keep in mind:
#   * The labels are a heuristic, so the metrics measure agreement with that
#     heuristic and not with ground truth. The split is by *project*, so no
#     building appears in both train and test, but a systematic layer-naming
#     mistake would not show up in any number here.
#   * model.use_layer_fusion stays False. With labels derived from layers,
#     predicting each layer group's majority class already scores 100%, so
#     feeding layer identity in would hand over the answer.
#
# LICENCE: if the stage-1 checkpoint is used as `pretrain`, this model inherits
# CubiCasa5K's CC BY-NC 4.0 and is research-only. Train from scratch (pretrain:
# '') for anything that has to ship.

model:
  in_channels: 10
  semantic_classes: 3
  use_layer_fusion: False
  num_decoders: 3
  dropout: 0.1
  pre_norm: False
  num_heads: 8
  shared_decoder: True
  dim_feedforward: 512
  hidden_dim: 256
  num_queries: 800
  gauss_scale: 1.0
  normalize_pos_enc: False
  scalar: 1
  dn_mask_noise_scale: 0.0
  dn_label_noise_ratio: 0.2
  vision:
    dim: 64
    backbone: "hrnet48"
    yaml: "configs/svg/hrnet48.yaml"
    pretrained: "svgnet/pretrained/hrnet_ocr_cocostuff_3965_torch04.pth"

matcher:
  cost_class: 2.
  cost_mask: 7.
  cost_dice: 5.
  num_points: -1

criterion:
  num_classes: 3
  eos_coef: 0.05
  losses:
    - "labels"
    - "masks"
  ignore_label: -1
  # door, window, wall — sqrt-inverse frequency, normalised to mean 1.
  # Measured on the actual train split (800 of 2,254 tiles): door 4.78%,
  # window 3.36%, wall 6.05%, background 85.81%. Wall and window roughly
  # doubled once the layer regex stopped dropping WALLS/LINE_WALL/A-FIREWALL.
  # Without weighting the cheapest move is to call everything background,
  # which is how the earlier CubiCasa run collapsed.
  class_weights: [0.974, 1.161, 0.865]
  num_points: -1
  contrast:
    num_classes: 4
    stage: "Ua"
    num_layers: 5
    ftype: "f_out"
    dist: "l2"
    pos: "cnt"
    contrast_func: "softnn"
    sample: "label"
    temperature: 2.0
    weight: 8.0

data:
  train:
    img_size: 700
    type: 'svg'
    num_classes: 3
    data_root: 'dataset/us_plans/json4'
    repeat: 1
    split: "train"
    data_norm: "mean"
    aug:
      aug_prob: 0.3
      hflip: True
      vflip: True
      color: True
      rotate:
        enable: False
        angle: [-180,180]
      rotate2: False
      scale:
        enable: False
        ratio: [0.5,1.5]
      shift:
        enable: False
        scale: [-0.5,0.5]
      cutmix:
        enable: False
        queueK: 4
        relative_shift: [-0.5,0.5]

  test:
    img_size: 700
    type: 'svg'
    num_classes: 3
    data_root: 'dataset/us_plans/json4'
    repeat: 1
    split: "test"
    data_norm: "mean"
    aug: False

dataloader:
  train:
    batch_size: 2
    num_workers: 6
  test:
    batch_size: 2
    num_workers: 6

optimizer:
  type: 'AdamW'
  lr: 0.0002
  weight_decay: 0.1
  weight_decay_embed: 0.1
  decoder_multiplier: 1.0
  clip_gradients_enabled: True
  clip_gradients_type: "full_model"
  clip_gradients_norm_type: 2.0
  clip_gradients_value: 2.0

scheduler:
  type: 'cosine'
  warmup_epochs: 3
  min_lr: 1e-7

fp16: True
epochs: 60
step_epoch: 2
save_freq: 10
save_interval_iters: 500
# Stage-1 CubiCasa checkpoint. tools/train.py loads it non-strict and skips
# size-mismatched tensors, so the backbone transfers even if the head differs.
pretrain: './work_dirs/cc_3060/best.pth'
work_dir: './work_dirs/us_3060'

# batch 2 x 8 = effective 16, matching the learning rate above.
accumulate_steps: 8

# Stop when mIoU stops improving rather than always running 60 epochs.
early_stop:
  metric: miou
  patience: 8
  min_delta: 0.1
