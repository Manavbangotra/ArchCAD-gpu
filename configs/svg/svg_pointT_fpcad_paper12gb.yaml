# DPSS on FloorPlanCAD at the paper's model settings, on a single 12GB GPU.
#
# This is the best-quality option for one RTX 3060 / 4070 class card. Nothing
# about the model is reduced: full 980px input, 800 queries, HRNet-48 with the
# COCO-Stuff pretrained weights. Only the *batch* is traded away, and gradient
# accumulation buys it back.
#
#   batch_size 1 + accumulate_steps 16  -> effective batch 16
#   fp16 True                           -> roughly halves activation memory
#
# Measured: one fp32 training step at 980px / 800 queries / batch 1 peaks at
# ~7.8GB on the largest drawing in the test split (7,392 primitives), so it
# fits 12GB with headroom; fp16 leaves considerably more. Batch 2 at this
# resolution needs ~14GB and does not fit — hence accumulation rather than a
# larger batch.
#
# Slower per epoch than svg_pointT_fpcad_12gb.yaml (512px), but this is the
# configuration to use if you want results comparable to the paper.
#
# Differs from svg_pointT.yaml (ArchCAD) in one important way: FloorPlanCAD
# annotates 35 classes, not 30. The background semantic id follows the class
# count, so it is 35 here and the contrastive head sees 36 (35 + background).
model:
  in_channels: 10
  semantic_classes: 35
  #decoder
  num_decoders: 3
  dropout: 0.1
  pre_norm: False
  num_heads: 8
  shared_decoder: True
  dim_feedforward: 512
  hidden_dim: 256
  num_queries: 800
  gauss_scale: 1.0
  normalize_pos_enc: False
  #dn
  scalar: 1
  dn_mask_noise_scale: 0.0
  dn_label_noise_ratio: 0.2
  vision:
    dim: 64
    backbone: "hrnet48"
    yaml: "configs/svg/hrnet48.yaml"
    pretrained: "svgnet/pretrained/hrnet_ocr_cocostuff_3965_torch04.pth"

matcher:
  cost_class: 2.
  cost_mask: 7.
  cost_dice: 5.
  num_points: -1

criterion:
  num_classes: 35
  eos_coef: 0.05
  losses:
    - "labels"
    - "masks"
  ignore_label: -1
  class_weights: -1
  num_points: -1
  contrast:
    num_classes: 36 # bg+fg
    stage: "Ua"
    num_layers: 5
    ftype: "f_out"
    dist: "l2"
    pos: "cnt"
    contrast_func: "softnn"
    sample: "label"
    temperature: 2.0
    weight: 8.0

data:
  train:
    img_size: 980
    type: 'svg'
    data_root: 'dataset/FloorplanCAD/json'
    repeat: 1
    split: "train"
    data_norm: "mean"
    aug:
      aug_prob: 0.3
      hflip: True
      vflip: True
      color: True

      rotate:
        enable: False
        angle: [-180,180]
      rotate2: False

      scale:
        enable: False
        ratio: [0.5,1.5]

      shift:
        enable: False
        scale: [-0.5,0.5]

      cutmix:
        enable: False
        queueK: 4
        relative_shift: [-0.5,0.5]

  test:
    img_size: 980
    type: 'svg'
    data_root: 'dataset/FloorplanCAD/json'
    repeat: 1
    split: "test"
    data_norm: "mean"
    aug: False

dataloader:
  train:
    batch_size: 1
    num_workers: 2
  test:
    batch_size: 1
    num_workers: 2

optimizer:
  type: 'AdamW'
  lr: 0.00001
  weight_decay: 0.1
  weight_decay_embed: 0.1
  decoder_multiplier: 1.0
  clip_gradients_enabled: True
  clip_gradients_type: "full_model"
  clip_gradients_norm_type: 2.0
  clip_gradients_value: 2.0

scheduler:
  type: 'cosine'
  warmup_epochs: 3
  min_lr: 1e-7

fp16: True
epochs: 100
step_epoch: 2
save_freq: 1
pretrain: ''
work_dir: './work_dirs/fpcad_paper'

# Effective batch = 1 x 16 = 16, matching the lr above (train.py scales from this).
accumulate_steps: 16
