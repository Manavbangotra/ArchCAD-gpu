# Stage 2: one model on FloorPlanCAD + the US plan corpus + CubiCasa5K,
# Arch-43, one RTX 3060 (12 GB).
#
# Start from Stage 1 (svg_pointT_fpcad43_3060.yaml): FloorPlanCAD is the only
# source that labels the fine classes everywhere -- which toilet, which door --
# so it teaches *what* each symbol is; the US corpus teaches the drawing style of
# the plans the product actually receives, and *where* doors, walls and fixtures
# are, but mostly at the family level (door-any, fixture-any).
#
# What makes mixing them safe (svgnet/model/label_space.py, svgnet/data/multi.py):
#   * batches are single-source, drawn by `weight`, not by dataset size;
#   * `annotated` names what each source labels everywhere
#     (dataset/taxonomy.py ANNOTATED). An unmatched prediction of a class the
#     source never labels is not pushed to background, so US tiles stop teaching
#     that toilets are empty space;
#   * coarse_policy: keep sends door-any / fixture-any through as real targets,
#     scored on the sum of their members -- no more "every US door is a single
#     door", which is what `canonical` taught;
#   * stuff_classes: default gives walls and railings one mask per drawing in
#     every source, FloorPlanCAD's convention.
#
# Launch (after Stage 1 has a best.pth):
#   $env:PYTHONPATH='.'; $env:PYTHONUTF8='1'
#   python tools/train.py configs/svg/svg_pointT_joint43_3060.yaml --exp_name joint43 --work_dir work_dirs/joint43
#
# US tiles come from tools/select_tiles.py (plan viewports with labels, <= 16k
# primitives, 10% label-free negatives kept).
#
# LICENCE: FloorPlanCAD is research-use; CubiCasa5K is CC BY-NC 4.0; the repo
# LICENSE is academic-only. A model trained here is not cleared for commercial
# use in the takeoff product without resolving that.

model:
  in_channels: 10
  semantic_classes: 43
  use_layer_fusion: False
  num_decoders: 3
  dropout: 0.1
  pre_norm: False
  num_heads: 8
  shared_decoder: True
  dim_feedforward: 512
  hidden_dim: 256
  num_queries: 800
  gauss_scale: 1.0
  normalize_pos_enc: False
  scalar: 1
  dn_mask_noise_scale: 0.0
  dn_label_noise_ratio: 0.2
  vision:
    dim: 64
    backbone: "hrnet48"
    yaml: "configs/svg/hrnet48.yaml"
    pretrained: "svgnet/pretrained/hrnet_ocr_cocostuff_3965_torch04.pth"

matcher:
  cost_class: 2.
  cost_mask: 7.
  cost_dice: 5.
  num_points: -1

criterion:
  num_classes: 43
  eos_coef: 0.05
  losses:
    - "labels"
    - "masks"
  ignore_label: -1
  # Unweighted, like Stage 1. The US-only class weights were measured under
  # coarse_policy: canonical over US tiles alone, and would mis-weight the mix;
  # the partial-annotation mask already removes the largest source of
  # all-background pressure.
  class_weights: -1
  num_points: -1
  contrast:
    num_classes: 44
    stage: "Ua"
    num_layers: 5
    ftype: "f_out"
    dist: "l2"
    pos: "cnt"
    contrast_func: "softnn"
    sample: "label"
    temperature: 2.0
    weight: 8.0

_aug: &aug
  aug_prob: 0.3
  hflip: True
  vflip: True
  color: True
  rotate: {enable: False, angle: [-180, 180]}
  rotate2: False
  scale: {enable: False, ratio: [0.5, 1.5]}
  shift: {enable: False, scale: [-0.5, 0.5]}
  cutmix: {enable: False, queueK: 4, relative_shift: [-0.5, 0.5]}

data:
  train:
    type: multi
    split: train
    # One "epoch" = this many drawings, drawn by source weight. ~1.4 h at the
    # measured mix of ~0.6 s (FloorPlanCAD) and ~1.4 s (US) per step.
    samples_per_epoch: 6000
    img_size: 700
    num_classes: 43
    data_norm: mean
    stuff_classes: default
    aug: *aug
    sources:
      - name: fpcad
        data_root: dataset/FloorplanCAD/json
        weight: 0.35
        annotated: fpcad
      - name: us
        data_root: dataset/us_plans/json5
        file_list: dataset/us_plans/json5/{split}_selected.txt
        weight: 0.45
        annotated: us
        coarse_policy: keep
      # CubiCasa5K (dataset/parse_cubicasa.py --taxonomy arch): 4,197 plans of
      # residential outlines, ~560 primitives each. Clean drawings, real room
      # layouts, labelled sanitary and kitchen fixtures -- but no loose furniture.
      - name: cubicasa
        data_root: dataset/cubicasa5k/json
        weight: 0.2
        annotated: cubicasa
        coarse_policy: keep

  test:
    type: multi
    split: test
    img_size: 700
    num_classes: 43
    data_norm: mean
    stuff_classes: default
    aug: False
    sources:
      - name: fpcad
        data_root: dataset/FloorplanCAD/json
        max_samples: 500
        annotated: fpcad
      - name: us
        data_root: dataset/us_plans/json5
        file_list: dataset/us_plans/json5/{split}_selected.txt
        max_samples: 500
        annotated: us
        coarse_policy: keep
      - name: cubicasa
        data_root: dataset/cubicasa5k/json
        max_samples: 400
        annotated: cubicasa
        coarse_policy: keep

dataloader:
  train:
    batch_size: 1
    num_workers: 4
  test:
    batch_size: 1
    num_workers: 4

optimizer:
  type: 'AdamW'
  # 1e-4: 2e-4 made Stage-1 loss climb in epoch 2; a single-drawing
  # overfit converges cleanly at 1e-4.
  lr: 0.0001
  weight_decay: 0.1
  weight_decay_embed: 0.1
  decoder_multiplier: 1.0
  clip_gradients_enabled: True
  clip_gradients_type: "full_model"
  clip_gradients_norm_type: 2.0
  clip_gradients_value: 2.0

scheduler:
  type: 'cosine'
  warmup_epochs: 1
  min_lr: 1e-7

# fp32. Under fp16 the decoder's mask losses go NaN within ~5-14 epochs of
# a 16-drawing overfit once the (now actually loaded) HRNet features are
# live; fp32 on the same run stays finite. Open issue: find the overflowing op.
fp16: False
epochs: 40
step_epoch: 1
save_freq: 10
save_interval_iters: 1000
pretrain: './work_dirs/fpcad43_3060/best.pth'
work_dir: './work_dirs/joint43'
accumulate_steps: 16

# Best checkpoint and early stopping on the macro mean over sources, so the
# mix cannot trade FloorPlanCAD accuracy for US accuracy unnoticed.
early_stop:
  metric: miou
  patience: 6
  min_delta: 0.2
